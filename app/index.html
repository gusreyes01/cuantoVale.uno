<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CuantoVale.mx</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/foundation-sites@6.8.1/dist/css/foundation.min.css">
</head>
<body>
  <main class="grid-container">
    <header class="grid-x grid-padding-x align-middle">
      <div class="cell auto">
        <h1>¿Cuánto vale mi equipo?</h1>
        <p>Estimación basada en publicaciones recientes de Mercado Libre México.</p>
      </div>
      <div class="cell shrink"><img src="img/cuantovale_logo.png" alt="CuantoVale"></div>
    </header>

    <form id="valuation-form" class="callout" novalidate>
      <label>Categoría
        <select id="category" required><option value="">Selecciona una categoría</option></select>
      </label>
      <label>Modelo
        <select id="model" required disabled><option value="">Selecciona un modelo</option></select>
      </label>
      <label>Capacidad
        <select id="capacity" required disabled><option value="">Selecciona una capacidad</option></select>
      </label>
      <fieldset>
        <legend>Condición</legend>
        <label><input type="radio" name="condition" value="new" checked> Nuevo</label>
        <label><input type="radio" name="condition" value="used"> Usado</label>
      </fieldset>
    </form>

    <p id="status" role="status" aria-live="polite"></p>
    <section id="result" class="callout primary" hidden>
      <h2>Valor estimado: <span id="estimated-value"></span></h2>
      <p>Estimación orientativa del 90% del precio promedio observado.</p>
    </section>
  </main>
  <script src="js/services.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
